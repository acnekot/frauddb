<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#111116" />
  <title>反诈库直查</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <div class="row">
      <button class="gbtn" id="btnOpen" aria-label="打开数据库">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg></span>
      </button>
      <h1>反诈库直查</h1>
      <button class="gbtn" id="btnReload" aria-label="重新读取">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24L13 11h7V4l-2.35 2.35z"/></svg></span>
      </button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="chips" id="chips"></div>
  </header>

  <main id="view"></main>

  <div class="wm" id="wm"></div>

  <nav class="nav" id="nav">
    <button data-view="timeline" class="active">
      <span class="pill"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></span></span>
      <span class="lb">时间线</span>
    </button>
    <button data-view="tables">
      <span class="pill"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm8 16H5v-4h6v4zm0-6H5v-4h6v4zm0-6H5V5h6v2zm8 12h-6v-4h6v4zm0-6h-6v-4h6v4zm0-6h-6V5h6v2z"/></svg></span></span>
      <span class="lb">表格</span>
    </button>
    <button data-view="stats">
      <span class="pill"><span class="ic"><svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg></span></span>
      <span class="lb">统计</span>
    </button>
    <button data-view="more">
      <span class="pill"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg></span></span>
      <span class="lb">更多</span>
    </button>
  </nav>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept=".db,.sqlite,.sqlite3,application/octet-stream" style="display:none" />

  <script src="sqlite.js"></script>
  <script src="ui.js"></script>
</body>
</html>
